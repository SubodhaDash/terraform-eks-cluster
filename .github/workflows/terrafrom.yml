name: Terraform Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
      inputs:
          environment:
            description: 'Select the environment for Terraform validation'
            required: true
            type: choice
            options:
                - "dev"
                - "qa"
                - "prod"
            default: "dev"
permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Validate Terraform Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.2

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
     
      - name: Terraform Initialization (Without Backend)
        run: terraform init -backend=false 

      - name: Terraform Validation
        run: terraform validate

  terraform-plan:
    name: Terraform Plan ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    needs: terraform
    if: github.event_name == 'workflow_dispatch'

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.2
      
      - name: AWS Configuration
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-2

      - name: Terraform Initialization
        run: terraform init -backend-config=environments/${{ env.ENVIRONMENT }}/backend.hcl -reconfigure

      - name: Terraform Validation
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file=environments/${{ env.ENVIRONMENT }}/terraform.tfvars -out=tfplan

      - name: Save Terraform Plan as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ env.ENVIRONMENT }}
          path: tfplan
          if-no-files-found: error